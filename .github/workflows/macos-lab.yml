          tar -C artifacts -cf - . | /opt/homebrew/opt/openssl@3/bin/openssl cms -encrypt -binary -stream -aes256 -outform DER -out sheng-macos-27.cms recipient.pem
          shasum -a 256 sheng-macos-27.cms > sheng-macos-27.cms.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-macos-dual-12g-encrypted
          path: |
            sheng-macos-27.cms
            sheng-macos-27.cms.sha256
          compression-level: 0
          retention-days: 7
      - name: Seal failure logs
        if: failure()
        run: |
          set -euo pipefail
          mkdir failure-logs
          target=UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos
          if [ -d "$target/logs" ]; then cp -R "$target/logs" failure-logs/; fi
