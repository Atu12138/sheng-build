          printf '%s\n' "$RECIPIENT_CERT" > recipient.pem
          /opt/homebrew/opt/openssl@3/bin/openssl cms -encrypt -binary -stream -aes256 \
            -in data.dbr -outform DER -out sheng-macos-dual-data.cms recipient.pem
          shasum -a 256 sheng-macos-dual-data.cms > sheng-macos-dual-data.cms.sha256
