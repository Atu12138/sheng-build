name: sheng macOS dual-system Data seed

on: workflow_dispatch

permissions:
  contents: read

jobs:
  seed:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      UNIXNU_IPSW_JOBS: '16'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: c8f92b208068eeaa4cd2b0f592671f04ee70076e
          path: device
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 519d80242a5028ee123447b01bc3b809baed565f
          path: UniXNU
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Fetch the Data packing module
        working-directory: UniXNU
        run: git submodule update --init --depth 1 drivers/DarwinBoot
      - name: Install image tools
        run: brew install openssl@3 blacktop/tap/ipsw
      - name: Build a 40 GiB Data seed for local password provisioning
        working-directory: UniXNU
        env:
          PYTHONPATH: scripts
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import secrets
          import subprocess
          import sys
          from pathlib import Path
          from unixnu.cli import parser
          from unixnu.config import Context
          from unixnu.ipsw import Ipsw

          ctx = Context(parser().parse_args(['build', 'kernel', '-D', '../device', '--os', 'macos-27']))
          source = Ipsw(ctx).disk_image('OS')
          seed = Path('../data.dbr').resolve()
          account = {'name': 'unixnu', 'password': secrets.token_urlsafe(24)}
          subprocess.run(['sudo', sys.executable, str(Path('scripts/make-macos-data-seed.py').resolve()),
                          str(source), str(seed), '--gib', '40', '--skip-setup', '--user-stdin'],
                         input=json.dumps(account).encode(), check=True)
          subprocess.run(['sudo', 'chown', str(os.getuid()), str(seed)], check=True)
          PYTHON
