name: sheng macOS preserved-data upgrade

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: UniXNU core branch or commit
        type: string
        default: main
      root_storage:
        description: Build the userdata root image
        type: boolean
        default: true
      export_build_inputs:
        description: Export cached XNU objects and the SDK for a local build
        type: boolean
        default: false
      kernel_cache_key:
        description: Kernel cache to export
        type: string
        default: sheng-macos27-kernel-v1-d509f7e4757a27f5-43684813634

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-lab-${{ github.ref }}-${{ inputs.export_build_inputs && 'inputs' || 'images' }}
  cancel-in-progress: false

jobs:
  local-inputs:
    if: inputs.export_build_inputs
    uses: ./.github/workflows/export-kernel-cache.yml
    with:
      cache_key: ${{ inputs.kernel_cache_key }}
  images:
    if: ${{ !inputs.export_build_inputs }}
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_IPSW_JOBS: 16
      HOMEBREW_NO_AUTO_UPDATE: 1
      GITHUB_TOKEN: ${{ github.token }}
      UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      UNIXNU_LAB_PASSWORD: ${{ secrets.UNIXNU_LAB_PASSWORD }}
    steps:
      - name: Check out device sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: 6c42e1055ffb3b335fda991190ad221edaa7af3c
          path: device
          submodules: recursive
      - name: Check out upgrade harness
        uses: actions/checkout@v4
        with:
          path: diagnostic-harness
          sparse-checkout: |
            scripts/guard-sheng-memory.py
            scripts/installed-root-policy.json
            scripts/import-installed-root-policy.py
      - name: Check out core sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.core_ref }}
          path: UniXNU
          submodules: recursive
      - name: Check out firmware sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: 8156d2e54a9f57818dc8b415a1a7dc28ad9ba4be
          path: uefi-sheng
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Restore build inputs
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          key: sheng-macos27-build-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sheng-macos27-build-v1-${{ runner.os }}-
          path: |
            UniXNU/out/feeds
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/mesa-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/adreno-metal-bridge
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/m2v-target
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/mesa-tu-macos27
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr
            device/drivers/Ath12kWifi/deps
            device/.cache/firmware
      - name: Refresh pinned translator checkout
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, shutil, subprocess
          from pathlib import Path
          core = Path('UniXNU')
          pin = json.loads((core / 'scripts/data/gpu-metal-vulkan-inputs.json').read_text())['translator']['commit']
          source = core / 'out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference/metal2vulkan'
          signature = hashlib.sha256((pin + '\n').encode() + (core / 'scripts/build-adreno-metal-bridge.py').read_bytes() + b''.join(path.read_bytes() for path in sorted((core / 'drivers/AdrenoMetal/bridge/patches').glob('*.patch')))).hexdigest()
          stamp = source.with_name('unixnu-translator-patch.sha256')
          if source.exists():
              actual = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pin or not stamp.exists() or stamp.read_text().strip() != signature:
                  shutil.rmtree(source)
          stamp.parent.mkdir(parents=True, exist_ok=True)
          stamp.write_text(signature + '\n')
          PYTHON
      - name: Install build tools
        run: |
          brew install dtc llvm lld llvm@22 lld@22 cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup unifdef openssl@3 zstd blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          python3 - <<'PYTHON'
          from pathlib import Path
          toolchain = Path('uefi-toolchain').resolve()
          toolchain.mkdir()
          for name in ('clang', 'llvm-lib', 'llvm-rc', 'lld-link'):
              package = 'lld@22' if name == 'lld-link' else 'llvm@22'
              (toolchain / name).symlink_to(Path('/opt/homebrew/opt') / package / 'bin' / name)
          with Path(__import__('os').environ['GITHUB_ENV']).open('a') as output:
              output.write('CLANG_BIN=' + str(toolchain) + '/\n')
          PYTHON
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Identify kernel SDK cache
        id: kernel-sdk
        run: |
          python3 - <<'PYTHON'
          import hashlib, os, subprocess
          from pathlib import Path
          version = subprocess.check_output(['xcodebuild', '-version']) + subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'])
          key = 'sheng-macos27-kernel-v1-' + hashlib.sha256(version).hexdigest()[:16]
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('key=' + key + '\n')
          PYTHON
      - name: Restore kernel compile records
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.kernel-sdk.outputs.key }}-${{ github.run_id }}
          restore-keys: ${{ steps.kernel-sdk.outputs.key }}-
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/xnu-inputs.json
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/xnu-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/fakeroot
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/xnu
      - name: Retrieve verified previous build
        run: |
          gh run download 44119365612 --repo Atu12138/sheng-build --name sheng-macos-27 --dir previous-artifacts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          source = Path('previous-artifacts')
          seed = source / 'data.dbr'
          assert hashlib.sha256(seed.read_bytes()).hexdigest() == 'a8a3d462267138556cb0aa73368b960e40355502d6aa12da63de56d0960c90d7'
          runtime = Path('UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime')
          runtime.mkdir(parents=True, exist_ok=True)
          import shutil
          shutil.copyfile(seed, runtime / 'data.dbr')
          print('Verified original Data seed; current device seed will be preserved during local final packaging.')
          PY
      - name: Apply verified board memory guard
        run: |
          python3 diagnostic-harness/scripts/guard-sheng-memory.py uefi-sheng/Platforms/Xiaomi/shengPkg/Library/MemoryMapLib/MemoryMapLib.c
          printf '\n# Local tablet evidence: preserve low-bank end 0x8B9D00000; previous guarded build reached the macOS desktop. Upgrade has not yet been hardware tested.\n' >> device/porting.toml
      - name: Select locked Wi-Fi source revisions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          root = Path('device/drivers/Ath12kWifi')
          lock = json.loads((root / 'tools/source-lock.json').read_text())
          def git(directory, *args):
              return subprocess.check_output(['git', '-C', str(directory), *args], text=True).strip()
          for name in ('linux', 'freebsd'):
              source = lock[name]
              paths = [value.strip('/') for value in source['paths']]
              directory = root / 'deps' / name
              directory.parent.mkdir(parents=True, exist_ok=True)
              if not directory.exists():
                  directory.mkdir()
                  git(directory, 'init')
                  git(directory, 'remote', 'add', 'origin', source['url'])
                  git(directory, 'sparse-checkout', 'init', '--cone')
              else:
                  changes = git(directory, 'diff', '--name-only', 'HEAD', '--', *paths).splitlines()
                  changes = [path for path in changes if not path.startswith('include/uapi/linux/netfilter')]
                  if changes:
                      raise SystemExit(name + ': refusing to replace modified imported sources')
              git(directory, 'fetch', '--depth', '1', '--filter=blob:none', 'origin', source['commit'])
              git(directory, 'checkout', '--detach', source['commit'])
              git(directory, 'sparse-checkout', 'add', '--skip-checks', *paths)
              assert git(directory, 'rev-parse', 'HEAD') == source['commit']
              print(name + ': selected source-lock commit ' + source['commit'])
          PY
      - name: Prepare installation
        working-directory: UniXNU
        run: |
          ./unixnu defconfig sheng_macos_defconfig -D ../device --os macos-27
          ./unixnu fetch --os macos-27
          python3 ../diagnostic-harness/scripts/import-installed-root-policy.py ../diagnostic-harness/scripts/installed-root-policy.json ../device/scripts/policies/macos-27.3-26C5035r
          if [ '${{ inputs.root_storage }}' = true ]; then
            python3 ../device/scripts/prepare-macos-install.py
          else
            python3 ../device/scripts/prepare-macos-install.py --reuse-policies
          fi
      - name: Build images
        id: build-images
        working-directory: device
        run: scripts/package.sh --os macos-27 --uefi ../uefi-sheng
      - name: Verify preserved root and memory guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct, json
          runtime = Path('UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr')
          assert hashlib.sha256(runtime.read_bytes()).hexdigest() == 'a8a3d462267138556cb0aa73368b960e40355502d6aa12da63de56d0960c90d7'
          needle = struct.pack('<QQ', 0x880000000, 0x39D00000)
          matches = [str(p) for p in Path('uefi-sheng/Build').rglob('*') if p.suffix.lower() in ('.efi', '.dll') and needle in p.read_bytes()]
          assert matches, 'Verified tablet memory guard missing'
          target = Path('UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos')
          import base64
          installed = json.loads(Path('diagnostic-harness/scripts/installed-root-policy.json').read_text())
          key = base64.b64decode(installed['public_key_base64'])
          assert key in (target / 'kernel/kernel.macho').read_bytes(), 'Compiled kernel does not trust the current installed root'
          for name in ('OS', 'SystemOS', 'App'):
              directory = Path('device/scripts/policies/macos-27.3-26C5035r') / name
              assert (directory / 'manifest.header.bin').read_bytes() == base64.b64decode(installed['signed_headers'][name])
          records = dict(device='6c42e1055ffb3b335fda991190ad221edaa7af3c', core='bba3b57879e94e5ec1632daafb74cbcab8af49a5', firmware='8156d2e54a9f57818dc8b415a1a7dc28ad9ba4be', memory_guard=matches, root_disk_reused=True, root_signing_key_sha256=installed['public_key_sha256'], hardware_tested=False)
          (target / 'upgrade-verification.json').write_text(json.dumps(records, indent=2)+'\n')
          print('Existing root policy signatures imported; verified memory guard present.')
          PY
      - name: Export upgrade firmware and manifests
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-firmware-symbols
          path: |
            uefi-sheng/Build/**/*.fd
            uefi-sheng/Build/**/DarwinBoot.efi
            uefi-sheng/Build/**/DarwinBoot.pdb
            uefi-sheng/Build/**/DarwinBoot.map
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/boot/boot.json
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/upgrade-verification.json
            diagnostic-harness/scripts/guard-sheng-memory.py
            device/porting.toml
          retention-days: 7
      - name: Publish shader inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-inventory
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/prime-list.txt
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/prime-list.json
          retention-days: 7
      - name: Build root storage
        if: inputs.root_storage
        working-directory: UniXNU
        run: |
          python3 - <<'PY'
          import subprocess, sys
          sys.path.insert(0, 'scripts')
          from unixnu.cli import parser
          from unixnu.config import Context
          ctx = Context(parser().parse_args(['build', 'userdata', '-D', '../device', '--os', 'macos-27']))
          objects = []
          for window in ctx.board['userdata']['windows']:
              name = window['name']
              objects += ['--object', f'{name}.vroot={ctx.tree}/build/verified-root-{name}/hashes.bin']
          subprocess.run(['./unixnu', 'build', 'userdata', '--os', 'macos-27', *objects], check=True)
          PY
      - name: Stage device artifacts
        env:
          BUILD_ROOT_STORAGE: ${{ inputs.root_storage }}
        run: |
          mkdir artifacts
          target=UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos
          cp "$target/boot/boot.img" "$target/payload/payload.img" "$target/kernel/kernel.macho" "$target/package.manifest.json" artifacts/
          cp "$target/runtime/data.dbr" artifacts/
          cp "$target/tree/build/prime-list.txt" "$target/tree/build/prime-list.json" artifacts/
          if [ "$BUILD_ROOT_STORAGE" = true ]; then
            cp "$target/userdata/userdata-root.json" artifacts/
            zstd -T0 -3 --sparse "$target/userdata/userdata-root.img" -o artifacts/userdata-root.img.zst
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-macos-27
          path: artifacts/
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            UniXNU/out/sheng/*/*/logs/*.log
            UniXNU/out/sheng/*/*/tree/build/adreno-metal-bridge/build-*.log
            UniXNU/out/sheng/*/*/tree/build/prime-list.*
            UniXNU/out/sheng/*/*/tree/build/sheng-source-storage/*.log
            UniXNU/out/sheng/*/*/tree/build/sheng-source-storage/*.command.json
          retention-days: 7
      - name: Save build inputs
        if: always() && steps.build-images.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: sheng-macos27-build-v1-${{ runner.os }}-${{ github.run_id }}
          path: |
            UniXNU/out/feeds
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/mesa-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/adreno-metal-bridge
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/m2v-target
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/mesa-tu-macos27
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr
            device/drivers/Ath12kWifi/deps
            device/.cache/firmware
      - name: Save kernel compile records
        if: always() && steps.build-images.outcome == 'success' && steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.kernel-sdk.outputs.key }}-${{ github.run_id }}
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/xnu-inputs.json
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/xnu-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/fakeroot
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/xnu
