        if: failure()
        with:
          name: sheng-ipados-diagnostics-encrypted
          retention-days: 3
          if-no-files-found: ignore
          path: sheng-ipados-diagnostics.cms
      - name: Encrypt device-specific images
        shell: bash
        run: |
          set -euo pipefail
          cat > recipient.pem <<'CERT'
