name: sheng iPadOS 27 build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      UNIXNU_IPSW_JOBS: 16
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: c8f92b208068eeaa4cd2b0f592671f04ee70076e
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 519d80242a5028ee123447b01bc3b809baed565f
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: b303410c8e401fc9419ae65a024356ed09a438ef
          path: uefi-sheng
          submodules: recursive
      - name: Verify the upstream touch driver revision
        run: |
          expected=988239b0b146cad7399892b9e9916895b95448af
          test "$(git -C device/drivers/ShengNovatekTouch rev-parse HEAD)" = "$expected"
          printf 'ShengNovatekTouch %s\n' "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: tools
        run: |
          brew install dtc llvm lld llvm@22 lld@22 openssl@3 unifdef cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          python3 - <<'PYTHON'
          from pathlib import Path
          toolchain = Path('uefi-toolchain').resolve()
          toolchain.mkdir()
          for name in ('clang', 'llvm-lib', 'llvm-rc', 'lld-link'):
              package = 'lld@22' if name == 'lld-link' else 'llvm@22'
              (toolchain / name).symlink_to(Path('/opt/homebrew/opt') / package / 'bin' / name)
          with Path(__import__('os').environ['GITHUB_ENV']).open('a') as output:
              output.write('CLANG_BIN=' + str(toolchain) + '/\n')
          PYTHON
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: Select locked Wi-Fi source revisions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          root = Path('device/drivers/Ath12kWifi')
          lock = json.loads((root / 'tools/source-lock.json').read_text())
          def git(directory, *args):
              return subprocess.check_output(['git', '-C', str(directory), *args], text=True).strip()
          for name in ('linux', 'freebsd'):
              source = lock[name]
              paths = [value.strip('/') for value in source['paths']]
              directory = root / 'deps' / name
              directory.parent.mkdir(parents=True, exist_ok=True)
              if not directory.exists():
                  directory.mkdir()
                  git(directory, 'init')
                  git(directory, 'remote', 'add', 'origin', source['url'])
                  git(directory, 'sparse-checkout', 'init', '--cone')
              else:
                  changes = git(directory, 'diff', '--name-only', 'HEAD', '--', *paths).splitlines()
                  changes = [path for path in changes if not path.startswith('include/uapi/linux/netfilter')]
                  if changes:
                      raise SystemExit(name + ': refusing to replace modified imported sources')
              git(directory, 'fetch', '--depth', '1', '--filter=blob:none', 'origin', source['commit'])
              git(directory, 'checkout', '--detach', source['commit'])
              git(directory, 'sparse-checkout', 'add', '--skip-checks', *paths)
              assert git(directory, 'rev-parse', 'HEAD') == source['commit']
              print(name + ': selected source-lock commit ' + source['commit'])
          PY
      - name: Prepare locked Wi-Fi userspace inputs
        run: |
          python3 device/drivers/Ath12kWifi/tools/fetch-sources.py
          python3 device/drivers/Ath12kWifi/tools/prepare-supplicant.py
      - name: Enable the Mach page reader for iPadOS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          patch = Path('UniXNU/drivers/AdrenoMetal/bridge/patches/0063-main-optimizations-on-development-46e7cc96.patch')
          data = patch.read_bytes()
          assert hashlib.sha256(data).hexdigest() == '6d8a717d2631920088be08614c1ba2ff6c23cf936b47762e7ab949237025b1c4'
          patch.write_bytes(data.rstrip(b'\n') + b'\n' + base64.b64decode(''))
          PY
      - name: Extract pinned board firmware
        run: |
          python3 device/scripts/extract-files.py
          python3 device/scripts/extract-files.py --section Video --check
          test -s device/.cache/firmware/qcom/sm8550/sheng/vpu30_4v.mbn
      - name: Match startup diagnostics to the iPadOS XNU layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          patch = Path('device/patches/xnu-12377/sheng-startup-failure-log.patch')
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == '8de0a88adb005b92ec6f52846fc13d6776b97c99f348688c17c3db75ee7877f3'
          patch.write_bytes(base64.b64decode(''))
          PY
      - name: Select the touch SPI component
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          path = Path('device/board.toml')
          text = path.read_text()
          first = text.index('["components"]')
          last = text.index('\n\n', first)
          section = text[first:last]
          assert tomllib.loads(section)['components']['include'].count('ShengUfs') == 1
          assert 'QcomGeniSpi' not in section
          fixed = text[:first] + section.replace('"ShengUfs"', '"ShengUfs", "QcomGeniSpi"', 1) + text[last:]
          assert 'QcomGeniSpi' in tomllib.loads(fixed)['components']['include']
          path.write_text(fixed)
          PY
      - name: Scope the clamshell diagnostic to macOS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          path = Path('device/package/KeyboardProbe.cpp')
          original = path.read_bytes()
          assert hashlib.sha256(original).hexdigest() == '30e36264f7b693994721a92b33d827b49436744db9c0f5b20583ab9462c95c9b'
          line = base64.b64decode('c3RhdGljIGNvbnN0IGNoYXIga0NsYW1zaGVsbExvZ1tdIEtFWUJPQVJEX0NPTlNUID0gInNoZW5nIGtleWJvYXJkOiBjbGFtc2hlbGwgJXMgc2VudCB0byB0aGUgcG93ZXIgbWFuYWdlclxuIjsK')
          assert original.count(line) == 1
          fixed = original.replace(line, b'#if defined(XNU_TARGET_OS_OSX) && XNU_TARGET_OS_OSX\n' + line + b'#endif\n')
          assert hashlib.sha256(fixed).hexdigest() == 'c8928a961118064fc34388e8fc78396799acdc0d4c3cc47921a36bc89988d10b'
          path.write_bytes(fixed)
          PY
      - name: Scope sleep diagnostics to macOS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, subprocess
          path = Path('device/package/ShengSleep.cpp')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == 'bc6bdedc360cf1acb82b30d5c28cb809bb58d92eeedc66d67dcbeda68cb23547'
          subprocess.run(['git', 'apply', '-'], input=base64.b64decode(''), check=True)
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '45ae20e250cbc9ba553fa525e01669fdca23968e0c31c663c685668bdf7c815d'
          PY
      - name: Select available iPadOS kernel interfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, subprocess
          for path, digest in [('device/package/BootLog.c', '42834fb2e3110e9731012b3e54927049b635569c3da0cb32612066a8bcbbe5cc'), ('device/package/LegacyDisplayProbe.cpp', 'ace25719d26936ea829fa99806c86506b264f186d357faa034c1e32ba0e060a8'), ('UniXNU/drivers/Adreno740/NativeAdrenoPublish.cpp', '92f316530294bb68ac181bd738b5b3a0e09b2854cd1356202f8dd040f0b96b8c'), ('UniXNU/drivers/RamBlock/NativeRamBlock.cpp', '772d47a069c50c9bf92f6c9292668340e005a61d996651033d9af2b6474b897c')]:
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          subprocess.run(['git','apply','-'], input=base64.b64decode(''), check=True)
          for path, digest in [('device/package/BootLog.c', '0a56812df99d292edfc3beccdb09b472280b8eb410ecac804c4778980b926698'), ('device/package/LegacyDisplayProbe.cpp', 'd66f87288f331fbbfa3ce0fc6360a14657f2839e22db25e2935c51512dd64725'), ('UniXNU/drivers/Adreno740/NativeAdrenoPublish.cpp', 'd502e911e27a09a0c66652850b38c5018b41e66acaeec6da5bbf9071e4ae4e00'), ('UniXNU/drivers/RamBlock/NativeRamBlock.cpp', '7c4f1d09594cd3eada0c6191319790c3b593b7cc4b75c9cecc943ed486b8fcf8')]:
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          print('Verified all four patched kernel source files')
          PY
      - name: Optimize iPadOS board driver code size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          for name, before, edits, after in [('build-ath12k-wifi.py', 'f1b5c9d604f5e5685832f8af9f97f15d7afd0e40c39b4203ff2e2344cb11894c', [("'-mkernel', '-O2',", "'-mkernel', ('-Os' if '-apple-ios' in TRIPLE else '-O2'),")], '87256fa156652c6a736860036db044183dcea4b860300c374711fc425ca47941'), ('build-gop-legacy-display-27.py', '0681663cf1a7c5ffc784aa83d4ccff7972054e0572626f7a5a04f617850914de', [("    run(cmd, cwd=r['directory'])\n\n\ndef compile_c", "    if not MACOS:\n        cmd.append('-Os')\n    run(cmd, cwd=r['directory'])\n\n\ndef compile_c"), ("    run(cmd, cwd=rc['directory'])\n\n\ncompile_cpp", "    if not MACOS:\n        cmd.append('-Os')\n    run(cmd, cwd=rc['directory'])\n\n\ncompile_cpp")], '0c439867977e82e6d1f2943f52c22fe5d155b9649c0554b17a156378d66af0c5')]:
              script = Path('device/scripts') / name
              text = script.read_text()
              assert hashlib.sha256(text.encode()).hexdigest() == before
              for old, new in edits:
                  assert text.count(old) == 1
                  text = text.replace(old, new, 1)
              assert hashlib.sha256(text.encode()).hexdigest() == after
              compile(text, str(script), 'exec')
              script.write_text(text)
          PY
      - name: Allocate iPadOS driver buffers at runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, subprocess
          device = Path('device')
          for name, digest in {'drivers/QcomIris/kernel/IrisMedia.cpp': '5e5d039163862ea0c31402bad42d47d2c1202da6250158b5ac11ab9b894fcd6a', 'drivers/QcomIris/kernel/VtHost.cpp': '396238c55bab339be9d30f0b96e72c13094626ab2c6151bc96bb8d2035000686', 'drivers/QcomIris/tests/kernel-stub/IOKit/IOLib.h': '27f92adab0dc2855a6392cf3c1feb7470914388c456b16a747394e6acff3b81f', 'package/BootLog.c': '0a56812df99d292edfc3beccdb09b472280b8eb410ecac804c4778980b926698', 'package/WifiProbe.cpp': 'e449a40b423ed0f4b0750cb5c1edcd8139cbe9bd11b73a82d2885c8ad21060a5'}.items():
              assert hashlib.sha256((device / name).read_bytes()).hexdigest() == digest, name
          subprocess.run(['git', 'apply', '--exclude=porting.toml', '-'], cwd=device,
                         input=base64.b64decode(''), check=True)
          for name, digest in {'drivers/QcomIris/kernel/IrisMedia.cpp': '5d91dd48f2dfd59826029c8e61a2ec0bdf77d381fcd85e6b5c183e1ac42d6f06', 'drivers/QcomIris/kernel/VtHost.cpp': '667c7c48a08426afebc8d2dd8a4fa89c6755c43123afdb02b8eba56210986858', 'drivers/QcomIris/tests/kernel-stub/IOKit/IOLib.h': '68ec67791ae9774ddd07b2037711c259b745180ff5fcf34805564703cec2db4c', 'package/BootLog.c': '1fdff1d4bbd0afd002c3f725ee5dc1b137864d3d59f83127dbf9df8d41b6b367', 'package/WifiProbe.cpp': '05491aded77e87785c78e6ad8612bea254e12109f5b608b7a5c859ab229b81cf'}.items():
              assert hashlib.sha256((device / name).read_bytes()).hexdigest() == digest, name
          print('Verified runtime allocations from sheng community commit 9b0fdfd')
          PY
      - name: Bind the iPadOS USB interrupt-context function
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          kit = Path('UniXNU/kits/XnuPrelink')
          revision = subprocess.check_output(['git', '-C', str(kit), 'rev-parse', 'HEAD'], text=True).strip()
          assert revision == '440589b0c31625f17edf363e24b3c82c51c70bb9', revision
          fixture = kit / 'fixtures/fileset-24A446-symbols.json'
          original = fixture.read_bytes()
          assert hashlib.sha256(original).hexdigest() == '026fb497af4d9bc3afc28b6a22be3210ba52ae0c4b5193ce9b34a4b72792b5d8'
          symbols = json.loads(original)
          record = {'original': '0xfffffe000aec5fac', 'original_size': 52, 'original_sha256': '392c95f5d1bfc12d57b6fbd680d3630e803ff30d70dcc69e9ea12f0be46fb53b', 'native_symbol': '_ml_at_interrupt_context', 'evidence': '24A446 AppleUSBXHCI chained fixup 0xfffffe00084368e8 targets this function. It reads DAIF, then returns whether per-CPU interrupt state is nonnull when interrupts are masked, matching ml_at_interrupt_context in XNU osfmk/arm/machine_routines_common.c. The same relocated slot in two historical sheng iPadOS collections points to the named native function.'}
          assert not any(item['original'] == record['original'] for item in symbols['functions'])
          symbols['functions'].append(record)
          fixture.write_text(json.dumps(symbols, indent=2) + '\n')
          print('Added verified iPadOS USB binding:', record['original'], record['native_symbol'])
          PY
      - name: Build iPadOS 27.0.1
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/package.sh --os 27 --uefi ../uefi-sheng --init-data
